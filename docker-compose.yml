version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["npm", "run", "--workspace", "app", "start", "--", "--tunnel"]
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      EXPO_USE_DEV_SERVER: "true"
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - app_node_modules:/workspace/app/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
    stdin_open: true
    tty: true
    working_dir: /workspace

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: ["npm", "run", "--workspace", "web", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/web/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
    working_dir: /workspace

volumes:
  root_node_modules:
  app_node_modules:
  web_node_modules:
  shared_node_modules:
